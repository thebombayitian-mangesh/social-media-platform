spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Post Service
spring.cloud.gateway.server.webmvc.routes[1].id=post-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://POST-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/posts/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# Like Service
spring.cloud.gateway.server.webmvc.routes[2].id=like-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://LIKE-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/likes/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Comment Service
spring.cloud.gateway.server.webmvc.routes[3].id=comment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://COMMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/comments/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1